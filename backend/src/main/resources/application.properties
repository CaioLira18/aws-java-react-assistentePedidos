spring.application.name=foodassistant

spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.flyway.enabled=true
spring.jpa.open-in-view=false

aws.region=${AWS_REGION:us-east-1}
aws.profile=${AWS_PROFILE:}
bedrock.embedding.model-id=${BEDROCK_EMBEDDING_MODEL_ID:amazon.titan-embed-text-v2:0}
bedrock.embedding.dimensions=1024

app.llm.model-id=<id do modelo>
app.llm.pricing.input-per-million-usd=<preço>
app.llm.pricing.output-per-million-usd=<preço>